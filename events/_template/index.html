<!doctype html>
<html lang="en">

<!--
  EVENT PAGE TEMPLATE
  ===================
  To add an event (full steps: docs/COMPONENT-GUIDE.md §4.1):
    1. Copy this folder to events/<slug>/  (slug = short-name-yyyy-mm, never changed once shared).
    2. Replace every [BRACKETED] value. Delete the noindex line below.
    3. Put the poster at assets/images/events/<slug>/poster.jpg (≈1280px wide).
    4. Pick ONE action block (UPCOMING / SOLD OUT / PAST) and delete the other two.
    5. In data/events.json add  "url": "/events/<slug>/"  to the event, so the cards link here.
  The Astro port turns this file into one template fed by the event's data.
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="robots" content="noindex"> <!-- DELETE on a real event page -->

  <title>[Event title] — CHIMAERA</title>

  <meta name="description" content="[Medium] at [Venue], [DD.MM.YYYY]. [One short sentence.]">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CHIMAERA">
  <meta property="og:title" content="[Event title] — CHIMAERA">
  <meta property="og:description" content="[Medium] at [Venue], [DD.MM.YYYY].">
  <meta property="og:image" content="/assets/images/events/[slug]/poster.jpg">

  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="/assets/graphics/mascot-coral.png">

  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/koo7phy.css">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/navigation.css">
  <link rel="stylesheet" href="/css/event.css">
  <link rel="stylesheet" href="/css/footer.css">
</head>


<body>

  <a class="skip-link" href="#main">
    Skip to content
  </a>

  <canvas id="atmosphere-canvas" aria-hidden="true">
  </canvas>

  <div data-include="/components/header.html"></div>

  <div data-include="/components/navigation.html"></div>


  <div class="site-content">

    <main id="main">

      <article class="event-page field-atmosphere" data-field="coral" aria-labelledby="event-title">

        <div class="event-page__inner">

          <a class="event-page__back" href="/#events">← All events</a>

          <div class="event-page__layout">

            <figure class="event-page__poster">
              <div class="event-page__poster-frame">
                <img src="/assets/images/events/[slug]/poster.jpg" width="1280" height="1707" alt="[Poster: event title and date]">

                <!-- SOLD OUT only: <span class="stamp">Sold out</span> -->
              </div>
            </figure>


            <div class="event-page__body">

              <header class="event-page__header">
                <p class="event-page__medium">[Textile painting]</p>

                <h1 id="event-title">[Event title]</h1>

                <p class="event-page__when">
                  <time datetime="[YYYY-MM-DD]T[19:00]">[DD.MM.YYYY] · [19:00]</time><br>
                  [Venue] · [Area]
                </p>
              </header>


              <div class="event-page__text">
                <p>[The invitation, ~25 words.]</p>
                <p>[What happens, ~35 words.]</p>
              </div>


              <dl class="event-page__details">
                <div>
                  <dt>Duration</dt>
                  <dd>[2–3 hours]</dd>
                </div>
                <div>
                  <dt>Bring</dt>
                  <dd>[Nothing. Everything is on the table.]</dd>
                </div>
                <div>
                  <dt>Experience</dt>
                  <dd>[None needed]</dd>
                </div>
              </dl>


              <!-- ===== UPCOMING ===== -->
              <a class="event-page__ticket" href="[https://buy.stripe.com/...]">
                Tickets · [150] kr <span aria-hidden="true">→</span>
              </a>

              <!-- ===== SOLD OUT ===== (also add the stamp on the poster)
              <a class="event-page__waitlist" href="#footer">Join the waitlist</a>
              -->

              <!-- ===== PAST ===== (photos: assets/images/events/[slug]/01.jpg …)
              <ul class="event-page__photos">
                <li><img src="/assets/images/events/[slug]/01.jpg" width="1280" height="1600" alt="" loading="lazy"></li>
                <li><img src="/assets/images/events/[slug]/02.jpg" width="1280" height="1600" alt="" loading="lazy"></li>
                <li><img src="/assets/images/events/[slug]/03.jpg" width="1280" height="1600" alt="" loading="lazy"></li>
              </ul>
              <a class="event-page__next" href="#footer">Hear about the next one first →</a>
              -->

            </div>

          </div>

        </div>

      </article>

    </main>

    <div data-include="/components/footer.html"></div>

  </div>


  <script src="/js/include.js"></script>

  <script src="/js/atmosphere.js"></script>

  <script src="/js/navigation.js"></script>

  <script src="/js/header-theme.js"></script>

  <script src="/js/page-chrome.js"></script>

</body>

</html>
